<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120a24" />
    <meta name="robots" content="noindex" />
    <title>Accesso riservato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        color: #fff1e0;
        background:
          radial-gradient(circle at 50% 115%, rgba(255, 61, 139, 0.5), transparent 55%),
          radial-gradient(circle at 50% 100%, rgba(255, 211, 92, 0.25), transparent 40%),
          #0d0719;
        font-family: "Barlow", system-ui, sans-serif;
      }
      .card {
        width: min(420px, 100%);
        display: grid;
        gap: 18px;
        padding: 36px 28px;
        border: 1px solid rgba(255, 241, 224, 0.14);
        border-radius: 22px;
        background: rgba(13, 7, 25, 0.7);
        backdrop-filter: blur(12px);
        text-align: center;
      }
      .kicker {
        margin: 0;
        color: #ff3d8b;
        font-family: "Barlow Condensed", sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: "Anton", Impact, sans-serif;
        font-size: clamp(44px, 12vw, 60px);
        font-weight: 400;
        line-height: 0.95;
        text-transform: uppercase;
        background: linear-gradient(135deg, #ffd35c, #ff7a59 35%, #ff3d8b 68%, #a45cff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { margin: 0; color: #b9a8cf; }
      form { display: grid; gap: 12px; margin-top: 6px; text-align: left; }
      label {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #b9a8cf;
      }
      input {
        width: 100%;
        min-height: 48px;
        margin-top: 6px;
        padding: 0 14px;
        border: 1px solid rgba(255, 241, 224, 0.25);
        border-radius: 12px;
        color: #fff1e0;
        background: rgba(255, 241, 224, 0.06);
        font: inherit;
        font-size: 16px;
      }
      input:focus-visible, button:focus-visible { outline: 3px solid #ffd35c; outline-offset: 2px; }
      button {
        min-height: 52px;
        margin-top: 6px;
        border: 0;
        border-radius: 999px;
        color: #0d0719;
        background: linear-gradient(135deg, #ffd35c, #ff7a59 35%, #ff3d8b 68%, #a45cff);
        font-family: "Barlow Condensed", sans-serif;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      .error { min-height: 1.4em; color: #ff7a9f; font-size: 15px; text-align: center; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="kicker">Accesso riservato</p>
      <h1>Non ancora</h1>
      <p>Qualcosa ti aspetta qui dentro. Torna lunedì mattina.</p>
      <form id="gate" autocomplete="on">
        <label>Nome utente<input name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required /></label>
        <label>Password<input name="pass" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Entra</button>
        <p class="error" role="alert"></p>
      </form>
    </main>

      const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

      async function unlock(user, pass) {
        const secret = new TextEncoder().encode(`${user.trim().toLowerCase()}:${pass}`);
        const base = await crypto.subtle.importKey("raw", secret, "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: bytes(vault.salt), iterations: vault.iterations, hash: "SHA-256" },
          base,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"],
        );
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(vault.iv) }, key, bytes(vault.data));
        return new TextDecoder().decode(plain);
      }

      const form = document.querySelector("#gate");
      const error = form.querySelector(".error");
      const button = form.querySelector("button");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        error.textContent = "";
        try {
          const html = await unlock(form.user.value, form.pass.value);
          document.open();
          document.write(html);
          document.close();
        } catch {
          error.textContent = "Nome utente o password errati.";
          button.disabled = false;
        }
      });
      })();
    </script>
